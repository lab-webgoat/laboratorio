services:
  webgoat:
    image: webgoat/webgoat:latest
    container_name: webgoat
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - webgoat_data:/home/webgoat/.webgoat-2025.3

  webwolf:
    image: webgoat/webwolf:latest
    container_name: webwolf
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      TZ: America/Sao_Paulo

  zap:
    image: zaproxy/zap-stable:latest
    container_name: zap
    user: "zap"
    restart: unless-stopped
    command: sh -c "zap-webswing.sh & zap.sh -daemon -port 8090 -host 0.0.0.0"
    ports:
      - "127.0.0.1:8181:8080"
      - "127.0.0.1:8090:8090"
    environment:
      TZ: America/Sao_Paulo
      ZAP_PORT: "8090"
    volumes:
      - zap_data:/home/zap/.ZAP

volumes:
  zap_data:
  webgoat_data:
